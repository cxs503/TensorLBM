name: Repository governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile canonical Python source
        run: python -m compileall -q src/tensorlbm
      - name: Check repository structure and benchmark assets
        run: bash tools/check_repository_governance.sh
