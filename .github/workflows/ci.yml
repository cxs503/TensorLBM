name: CI

on:
  push:
  pull_request:
  schedule:
    # Nightly full run (03:00 UTC) so the slow campaigns keep a cadence even
    # when no one pushes for a while.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes in-flight runs; main is never
  # cancelled so the nightly/slow signal stays intact.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Static gates run once, on a single interpreter: they are interpreter
  # independent, so fanning them across the matrix only burns minutes.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests examples benchmarks
      - name: Format check (ruff format)
        run: ruff format --check src tests examples benchmarks
      - name: Type check (mypy core gate)
        run: mypy src/tensorlbm/d2q9.py src/tensorlbm/d3q19.py src/tensorlbm/solver.py src/tensorlbm/utils.py --ignore-missing-imports
      - name: Type check (mypy full advisory)
        run: mypy src/tensorlbm --ignore-missing-imports
        continue-on-error: true
      - name: Check docs-implementation consistency
        run: python scripts/check_platform_docs_consistency.py

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python >=3.11; test what we advertise.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # Pull requests get the fast signal; pushes to main, the nightly cron and
      # manual dispatches run the slow simulation campaigns too.  --timeout
      # activates pytest-timeout (already a dev extra, previously unused) so a
      # hung solver fails the job instead of burning the 6h runner limit.
      - name: Select test scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'args=-m "not slow" --timeout=600' >> "$GITHUB_OUTPUT"
            echo "scope=fast (slow campaigns deselected)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'args=--timeout=1800' >> "$GITHUB_OUTPUT"
            echo "scope=full (including slow campaigns)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run tests with coverage
        run: pytest -q ${{ steps.scope.outputs.args }} --cov=tensorlbm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke-check wheel installs cleanly
        run: |
          # Only verify metadata — torch is not installed in this job
          pip install dist/*.whl --force-reinstall --no-deps
          python -c "
          import importlib.metadata
          v = importlib.metadata.version('tensorlbm')
          print('tensorlbm', v, 'installed OK')
          assert v, 'empty version'
          "
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
