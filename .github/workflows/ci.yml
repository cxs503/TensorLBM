name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests examples benchmarks
      - name: Format check (ruff format)
        run: ruff format --check src tests examples benchmarks
      - name: Type check (mypy core gate)
        run: mypy src/tensorlbm/d2q9.py src/tensorlbm/d3q19.py src/tensorlbm/solver.py src/tensorlbm/utils.py --ignore-missing-imports
      - name: Type check (mypy full advisory)
        run: mypy src/tensorlbm --ignore-missing-imports
        continue-on-error: true
      - name: Check docs-implementation consistency
        run: python scripts/check_platform_docs_consistency.py
      - name: Run tests with coverage
        run: PYTHONPATH=src pytest -q --cov=tensorlbm --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke-check wheel installs cleanly
        run: |
          # Only verify metadata — torch is not installed in this job
          pip install dist/*.whl --force-reinstall --no-deps
          python -c "
          import importlib.metadata
          v = importlib.metadata.version('tensorlbm')
          print('tensorlbm', v, 'installed OK')
          assert v, 'empty version'
          "
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
