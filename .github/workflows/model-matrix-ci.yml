name: Model matrix CI

# Model-as-CI-matrix-key practice (transferred from CFD-GO/TCLB
# "model-matrix-ci-plus-coverage"): every collision model is a matrix key.
#   guard  construct every model + one step (the compile-guard analogue)
#   run    analytic model x case matrix; the exit code IS the gate
#   integration  the production stepper driven by registry keys, bit-identical
#                to the legacy raw-function call
# A FAIL cell is an honest result and fails the job (physics is gated, not
# bookkeeping). Missing coverage fails the job as well.

on:
  pull_request:
    paths:
      - "src/tensorlbm/model_matrix/**"
      - "src/tensorlbm/lbm_step_correct.py"
      - "scripts/model_matrix_integration.py"
      - "tests/test_model_matrix.py"
      - ".github/workflows/model-matrix-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/tensorlbm/model_matrix/**"
      - "src/tensorlbm/lbm_step_correct.py"
      - "scripts/model_matrix_integration.py"
      - "tests/test_model_matrix.py"
      - ".github/workflows/model-matrix-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  TORCH_DEVICE_BACKEND_AUTOLOAD: "0"
  OMP_NUM_THREADS: "4"

jobs:
  model-matrix:
    runs-on: ci-loong64
    steps:
      - uses: actions/checkout@v4
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Guard pipeline (construct every model, one step)
        run: PYTHONPATH=src python -m tensorlbm.model_matrix guard --out artifacts/model_matrix_ci
      - name: Model x case matrix (gate on 3% analytic viscosity + coverage)
        run: PYTHONPATH=src python -m tensorlbm.model_matrix run --out artifacts/model_matrix_ci/run --tau 0.6,0.8 --res 16 --min-coverage 0.85
      - name: Integration through the shared stepper (bit-identical binding)
        run: PYTHONPATH=src python scripts/model_matrix_integration.py --out artifacts/model_matrix_ci/integration.json
      - name: Matrix tests
        run: PYTHONPATH=src pytest -q tests/test_model_matrix.py --timeout=900
      - name: Upload coverage and benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-matrix-evidence
          path: |
            artifacts/model_matrix_ci/run/model_matrix.json
            artifacts/model_matrix_ci/run/COVERAGE.md
            artifacts/model_matrix_ci/run/BENCHMARK_REF_VS_GOT.md
            artifacts/model_matrix_ci/run/figures/
            artifacts/model_matrix_ci/guard.json
            artifacts/model_matrix_ci/integration.json
          if-no-files-found: warn
