name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # required for trusted publishing (OIDC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build
      - name: Smoke-check wheel
        run: |
          python -m pip install dist/*.whl --force-reinstall --no-deps
          python -c "
          import importlib.metadata
          v = importlib.metadata.version('tensorlbm')
          print('tensorlbm', v, 'installed OK')
          assert v, 'empty version'
          "
      - name: Upload dist for publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi-release   # configure in repo Settings → Environments
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (trusted publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        # No API token needed when using trusted publishing.
        # To use a token instead, add:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
