name: Multiphase benchmark checks

on:
  pull_request:
    paths:
      - "src/tensorlbm/multiphase_benchmarks.py"
      - "tests/test_multiphase_*.py"
      - ".github/workflows/multiphase-benchmarks.yml"
  push:
    branches: [main]
    paths:
      - "src/tensorlbm/multiphase_benchmarks.py"
      - "tests/test_multiphase_*.py"
      - ".github/workflows/multiphase-benchmarks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-multiphase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint multiphase benchmark scope
        run: ruff check src/tensorlbm/multiphase_benchmarks.py tests/test_multiphase_physical_benchmarks.py tests/test_multiphase_pressure_diagnostic.py
      - name: Run fast multiphase acceptance tests
        run: pytest -q tests/test_multiphase_physical_benchmarks.py tests/test_multiphase_pressure_diagnostic.py -m "not slow" --timeout=600
